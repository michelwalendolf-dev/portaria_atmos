<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Portaria · Atmos Sunset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<style>
  :root { --gold: #eab65c; --ok: #38d27a; --bad: #ff6b5b; --warn: #f2bf58; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: "Jost", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  input[type=text] { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(234, 182, 92, .4); background: rgba(255, 255, 255, .05); color: #fff; font: 400 16px "Jost", sans-serif; letter-spacing: .08em; }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 15px; cursor: pointer; font: 600 14px "Jost", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #1a1204; background: linear-gradient(180deg, #fff6d6, #f2bf58); }
  header { padding: 14px 16px 6px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font: 500 26px "Cormorant Garamond", Georgia, serif; color: #f6d28a; }
  header span { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--gold); }
  .cam { position: relative; flex: 1; min-height: 0; margin: 8px 16px; border-radius: 18px; overflow: hidden; background: #0b0904; border: 1px solid rgba(234, 182, 92, .35); }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame { position: absolute; inset: 0; margin: auto; width: min(68%, 280px); aspect-ratio: 1; border-radius: 18px; border: 2px solid var(--gold); box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45); pointer-events: none; }
  .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 6px #000; }
  .retry { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: auto; padding: 14px 26px; }
  .load { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0, 0, 0, .62); backdrop-filter: blur(2px); font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #f6d28a; }
  .spin { width: 58px; height: 58px; border-radius: 50%; border: 4px solid rgba(234, 182, 92, .2); border-top-color: var(--gold); animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  .manual { display: flex; gap: 10px; padding: 8px 16px 16px; }
  .manual .btn { width: auto; padding: 0 22px; }
  .swal2-container { font-family: "Jost", system-ui, sans-serif; }
  .swal-atmos { background: #0b0904; color: #fff; border: 1px solid rgba(234, 182, 92, .45); border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .7); padding: 26px 20px 22px; }
  .swal-atmos.swal-ok { border-color: rgba(56, 210, 122, .8); box-shadow: 0 20px 60px rgba(0, 0, 0, .7), 0 0 50px rgba(56, 210, 122, .25); }
  .swal-atmos.swal-bad { border-color: rgba(255, 107, 91, .85); box-shadow: 0 20px 60px rgba(0, 0, 0, .7), 0 0 50px rgba(255, 107, 91, .25); }
  .swal-atmos .swal2-title { font: 600 22px "Jost", sans-serif; letter-spacing: .14em; text-transform: uppercase; padding: 0; color: #f6d28a; }
  .swal-atmos.swal-ok .swal2-title { color: var(--ok); }
  .swal-atmos.swal-bad .swal2-title { color: var(--bad); }
  .swal-atmos .swal2-html-container { margin: 10px 4px 0; color: rgba(255, 255, 255, .88); font-size: 16px; line-height: 1.5; }
  .swal-atmos .sw-nm { display: block; font: 500 32px "Cormorant Garamond", Georgia, serif; color: #fff; word-break: break-word; line-height: 1.15; }
  .swal-atmos .sw-pay { display: inline-block; margin-top: 12px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--warn); color: var(--warn); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
  .swal-atmos .swal2-timer-progress-bar { background: #eab65c; }
</style>
</head>
<body>
<section class="screen">
  <header><h1>Portaria</h1><span id="count">0 entradas</span></header>
  <div class="cam"><video id="v" playsinline muted></video><div class="frame"></div><div class="hint" id="hint">Toque para iniciar a leitura</div><div class="load" id="load" hidden><div class="spin"></div><span>Lendo ingresso…</span></div><button class="btn retry" id="retry">Iniciar leitura</button></div>
  <div class="manual">
    <input type="text" id="man" placeholder="ATMOS-XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" maxlength="17">
    <button class="btn" id="go">Validar</button>
  </div>
</section>

<script>
  const $ = s => document.querySelector(s);
  let busy = false, entradas = 0, lastCode = "", lastAt = 0;

  async function api(body) {
    const r = await fetch("/api/checkin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return r.json().catch(() => ({ error: "Erro. Tente de novo." }));
  }

  const MSG = {
    NotAllowedError: "Permita o acesso à câmera nas configurações do navegador",
    SecurityError: "Permita o acesso à câmera nas configurações do navegador",
    NotFoundError: "Nenhuma câmera encontrada neste aparelho",
    NotReadableError: "A câmera está em uso por outro app. Feche-o e tente de novo"
  };

  let ac = null, mudo = null;

  function wavMudo() {
    const n = 800, b = new Uint8Array(44 + n), d = new DataView(b.buffer);
    const w = (o, t) => [...t].forEach((c, i) => { b[o + i] = c.charCodeAt(0); });
    w(0, "RIFF"); d.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); d.setUint32(16, 16, true);
    d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, 8000, true); d.setUint32(28, 8000, true);
    d.setUint16(32, 1, true); d.setUint16(34, 8, true); w(36, "data"); d.setUint32(40, n, true); b.fill(128, 44);
    return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
  }

  function liberaAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) { }
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) { }
    try {
      if (!mudo) { mudo = new Audio(wavMudo()); mudo.loop = true; mudo.setAttribute("playsinline", ""); }
      mudo.play().catch(() => { });
    } catch (e) { }
  }

  function tom(freq, ini, dur, tipo, vol) {
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    const t = ac.currentTime + ini, o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function sinal(vib, notas) {
    try { if (navigator.vibrate) navigator.vibrate(vib); } catch (e) { }
    try { notas.forEach(n => tom(n[0], n[1], n[2], n[3], n[4])); } catch (e) { }
  }

  document.addEventListener("visibilitychange", () => { if (!document.hidden && ac && ac.state === "suspended") ac.resume(); });

  async function start() {
    $("#retry").hidden = true;
    liberaAudio();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $("#hint").textContent = "Abra este link direto no Chrome ou Safari (não dentro de outro app)";
      $("#retry").hidden = false;
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      const v = $("#v"); v.srcObject = stream; await v.play();
      $("#hint").textContent = window.jsQR || det ? "Aponte para o QR Code" : "Leitor não carregou. Recarregue a página";
      requestAnimationFrame(tick);
    } catch (e) {
      $("#hint").textContent = (MSG[e.name] || "Câmera indisponível") + ". Ou use o código manual";
      $("#retry").textContent = "Tentar de novo";
      $("#retry").hidden = false;
    }
  }

  let det = null;
  try { if ("BarcodeDetector" in window) det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { det = null; }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  let scanning = false;

  async function tick() {
    const v = $("#v");
    if (!busy && !scanning && v.readyState >= 2 && v.videoWidth) {
      scanning = true;
      try {
        let data = "";
        if (det) { const r = await det.detect(v); if (r.length) data = r[0].rawValue; }
        if (!data && window.jsQR) {
          const k = Math.min(1, 960 / v.videoWidth);
          cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
          cx.drawImage(v, 0, 0, cv.width, cv.height);
          const q = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: "dontInvert" });
          if (q && q.data) data = q.data;
        }
        if (data) check(data);
      } catch (e) { }
      scanning = false;
    }
    requestAnimationFrame(tick);
  }

  const VIEW = {
    ok: { c: "var(--ok)", ic: "✓", st: "Entrada liberada" },
    used: { c: "var(--bad)", ic: "✕", st: "Já utilizado" },
    invalid: { c: "var(--bad)", ic: "✕", st: "Ingresso inválido" },
    error: { c: "var(--warn)", ic: "!", st: "Erro" }
  };

  async function check(raw) {
    const code = String(raw).trim().toUpperCase();
    if (busy || (code === lastCode && Date.now() - lastAt < 4000)) return;
    busy = true; lastCode = code; lastAt = Date.now();
    $("#load").hidden = false; sinal(90, [[880, 0, 0.12]]);
    $("#hint").textContent = "Validando…";
    let d;
    try { d = await api({ code }); } catch (e) { d = { error: "Sem conexão." }; }
    show(d);
  }

  const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const SOM = {
    ok: [[60, 60, 160], [[1175, 0, 0.12], [1568, 0.15, 0.2]]],
    used: [[160, 90, 160, 90, 160], [[330, 0, 0.2], [330, 0.28, 0.2], [262, 0.56, 0.35]]],
    invalid: [[500], [[165, 0, 0.45, "sawtooth", 0.35], [110, 0.5, 0.8, "sawtooth", 0.35]]],
    error: [[160, 90, 160], [[262, 0, 0.25], [220, 0.3, 0.4]]]
  };

  function libera() {
    lastAt = Date.now();
    $("#hint").textContent = "Aponte para o QR Code";
    $("#man").value = "";
    busy = false;
  }

  function show(d) {
    const key = d.error ? "error" : d.status in VIEW ? d.status : "error";
    const m = VIEW[key];
    $("#load").hidden = true;
    if (key === "ok") { entradas++; $("#count").textContent = entradas + (entradas === 1 ? " entrada" : " entradas"); }
    sinal(SOM[key][0], SOM[key][1]);

    const linhas = [];
    if (d.nome) linhas.push('<span class="sw-nm">' + esc(d.nome) + "</span>");
    const sub = d.nome ? [d.tipo, key === "used" && d.at ? "Entrou em " + d.at : ""].filter(Boolean).join(" · ") : d.error || "";
    if (sub) linhas.push(esc(sub));
    if (key === "ok" && /cart[aã]o/i.test(d.pagamento || "")) {
      const vl = Number(d.valor);
      linhas.push('<span class="sw-pay">Cobrar no cartão' + (vl ? " · R$ " + vl.toFixed(2).replace(".", ",") : "") + "</span>");
    }

    if (!window.Swal) { $("#hint").textContent = m.st + (d.nome ? " · " + d.nome : ""); setTimeout(libera, 3000); return; }
    Swal.fire({
      icon: key === "ok" ? "success" : key === "used" ? "warning" : "error",
      title: m.st,
      html: linhas.join("<br>"),
      timer: 3000, timerProgressBar: true, showConfirmButton: false,
      allowOutsideClick: false, allowEscapeKey: false,
      customClass: { popup: "swal-atmos " + (key === "ok" ? "swal-ok" : "swal-bad") },
      buttonsStyling: false, background: "#0b0904", color: "#fff", backdrop: "rgba(0, 0, 0, .78)",
      iconColor: key === "ok" ? "#38d27a" : key === "used" ? "#f2bf58" : "#ff6b5b",
      scrollbarPadding: false, heightAuto: false, returnFocus: false,
      didClose: libera
    });
  }

  $("#retry").onclick = start;
  $("#go").onclick = () => { const c = $("#man").value.trim(); if (c) { lastCode = ""; check(c); } };
  $("#man").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });

</script>
</body>
</html>
