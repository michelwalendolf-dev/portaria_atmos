<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0804">
<title>Portaria · Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Archivo:wdth,wght@62..125,700..900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  :root {
    --night: #0e0804; --panel: #1a110a; --line: #3b2a15;
    --sand: #f3e6cf; --mute: rgb(243 230 207 / .62);
    --gold: #eab65c; --ink: #1a1204;
    --sans: "Hanken Grotesk", system-ui, sans-serif;
    --disp: "Archivo", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--night); color: var(--sand); font: 400 16px/1.4 var(--sans); -webkit-text-size-adjust: 100%; }
  body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; padding-top: env(safe-area-inset-top); -webkit-tap-highlight-color: transparent; }

  /* Topo: nome da tela e contagem de entradas */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 14px 18px 12px; }
  .top h1 { margin: 0; font: 800 24px/1 var(--disp); font-stretch: 112%; }
  .top p { margin: 6px 0 0; font-size: 13px; color: var(--mute); }
  .cnt { text-align: right; }
  .cnt b { display: block; font: 800 34px/1 var(--disp); font-variant-numeric: tabular-nums; }
  .cnt span { font-size: 13px; color: var(--mute); }

  /* Câmera ocupa a largura toda */
  .cam { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #080503; }
  video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; inset: 0; margin: auto; width: min(66%, 300px); aspect-ratio: 1; border-radius: 22px; box-shadow: 0 0 0 100vmax rgb(14 8 4 / .55); pointer-events: none; }
  .frame svg { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round; }
  .hint { position: absolute; left: 16px; right: 16px; bottom: 16px; text-align: center; font-size: 15px; font-weight: 500; text-shadow: 0 1px 8px #000; }
  .retry { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .retry:active { transform: translate(-50%, -50%) scale(.98); }
  .load { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgb(14 8 4 / .72); font-weight: 500; }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgb(243 230 207 / .2); border-top-color: var(--gold); animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }

  /* Digitação manual */
  .dock { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; height: 52px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--night); color: var(--sand); font: 500 17px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
  input::placeholder { color: rgb(243 230 207 / .32); }
  .btn { height: 52px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--gold); color: var(--ink); font: 700 16px var(--sans); cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Resultado: a tela inteira vira o veredito */
  .res { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 18px; padding: calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 24px); background: var(--bg); color: var(--fg); animation: entra .2s cubic-bezier(.2, .8, .2, 1); cursor: pointer; }
  .res[data-s="ok"] { --bg: #0f7a45; --fg: #fff; }
  .res[data-s="used"] { --bg: #bf5a12; --fg: #fff; }
  .res[data-s="invalid"] { --bg: #b42318; --fg: #fff; }
  .res[data-s="error"] { --bg: #e3a72a; --fg: #1a1204; }
  @keyframes entra { from { opacity: 0; transform: translateY(14px); } }
  .res-head { display: flex; align-items: center; gap: 14px; }
  .ic { width: 56px; height: 56px; flex: none; display: grid; place-items: center; border: 3px solid currentColor; border-radius: 50%; }
  .ic svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .res h2 { margin: 0; font: 800 clamp(26px, 7vw, 34px)/1.05 var(--disp); }
  .res-main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .nm { margin: 0; font: 800 clamp(44px, 15vw, 88px)/.98 var(--disp); font-stretch: 75%; text-wrap: balance; overflow-wrap: anywhere; }
  .nm.msg { font: 700 clamp(24px, 7vw, 36px)/1.2 var(--sans); }
  .sub { margin: 14px 0 0; font-size: clamp(18px, 5vw, 24px); font-weight: 500; }
  .res-foot { font-size: 14px; opacity: .75; }
  .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 5px; background: currentColor; opacity: .45; transform-origin: left; animation: conta var(--t, 3000ms) linear forwards; }
  @keyframes conta { to { transform: scaleX(0); } }

  @media (prefers-reduced-motion: reduce) {
    .res { animation: none; }
    .spin { animation-duration: 2s; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    .top { padding: 8px 16px; }
    .cnt b { font-size: 26px; }
    .nm { font-size: clamp(32px, 9vw, 56px); }
  }
</style>
</head>
<body>
<header class="top">
  <div><h1>Portaria</h1><p>Pulse, The Bar Joinville</p></div>
  <div class="cnt" aria-live="polite"><b id="n">0</b><span id="nl">entradas</span></div>
</header>

<main class="cam">
  <video id="v" playsinline muted></video>
  <div class="frame"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M3 24V12a9 9 0 0 1 9-9h12M76 3h12a9 9 0 0 1 9 9v12M97 76v12a9 9 0 0 1-9 9H76M24 97H12a9 9 0 0 1-9-9V76"/></svg></div>
  <div class="hint" id="hint">Toque para iniciar a leitura</div>
  <div class="load" id="load" hidden><div class="spin"></div><span>Validando…</span></div>
  <button class="btn retry" id="retry" type="button">Iniciar leitura</button>
</main>

<form class="dock" id="manual" autocomplete="off">
  <input type="text" id="man" placeholder="PULSE-XXXXX-XXXXX" aria-label="Código do ingresso" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="20">
  <button class="btn" id="go" type="submit">Validar</button>
</form>

<div class="res" id="res" role="alertdialog" aria-live="assertive" aria-labelledby="rs-t" hidden>
  <div class="res-head"><span class="ic" id="rs-ic" aria-hidden="true"></span><h2 id="rs-t"></h2></div>
  <div class="res-main"><p class="nm" id="rs-nm"></p><p class="sub" id="rs-sub" hidden></p></div>
  <div class="res-foot">Toque para continuar</div>
  <i class="bar" id="rs-bar"></i>
</div>

<script>
  const $ = s => document.querySelector(s);
  let busy = false, entradas = 0, lastCode = "", lastAt = 0;

  function setCount(n) {
    entradas = n;
    $("#n").textContent = n;
    $("#nl").textContent = n === 1 ? "entrada" : "entradas";
  }

  /* O total é sempre o que a planilha informa; nunca somado no aparelho */
  async function atualizaTotal() {
    try {
      const d = await api({ count: true });
      if (typeof d.total === "number") setCount(d.total);
    } catch (e) { }
  }

  async function api(body) {
    const r = await fetch("/api/checkin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return r.json().catch(() => ({ error: "Erro. Tente de novo." }));
  }

  const MSG = {
    NotAllowedError: "Permita o acesso à câmera nas configurações do navegador",
    SecurityError: "Permita o acesso à câmera nas configurações do navegador",
    NotFoundError: "Nenhuma câmera encontrada neste aparelho",
    NotReadableError: "A câmera está em uso por outro app. Feche-o e tente de novo"
  };

  /* ---- áudio e vibração (mesmos sinais de antes) ---- */
  let ac = null, mudo = null;

  function wavMudo() {
    const n = 800, b = new Uint8Array(44 + n), d = new DataView(b.buffer);
    const w = (o, t) => [...t].forEach((c, i) => { b[o + i] = c.charCodeAt(0); });
    w(0, "RIFF"); d.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); d.setUint32(16, 16, true);
    d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, 8000, true); d.setUint32(28, 8000, true);
    d.setUint16(32, 1, true); d.setUint16(34, 8, true); w(36, "data"); d.setUint32(40, n, true); b.fill(128, 44);
    return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
  }

  function liberaAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) { }
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) { }
    try {
      if (!mudo) { mudo = new Audio(wavMudo()); mudo.loop = true; mudo.setAttribute("playsinline", ""); }
      mudo.play().catch(() => { });
    } catch (e) { }
  }

  function tom(freq, ini, dur, tipo, vol) {
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    const t = ac.currentTime + ini, o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function sinal(vib, notas) {
    try { if (navigator.vibrate) navigator.vibrate(vib); } catch (e) { }
    try { notas.forEach(n => tom(n[0], n[1], n[2], n[3], n[4])); } catch (e) { }
  }

  document.addEventListener("visibilitychange", () => { if (!document.hidden && ac && ac.state === "suspended") ac.resume(); });

  /* ---- câmera e leitura do QR ---- */
  async function start() {
    $("#retry").hidden = true;
    liberaAudio();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $("#hint").textContent = "Abra este link direto no Chrome ou Safari (não dentro de outro app)";
      $("#retry").hidden = false;
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      const v = $("#v"); v.srcObject = stream; await v.play();
      $("#hint").textContent = window.jsQR || det ? "Aponte para o QR Code" : "Leitor não carregou. Recarregue a página";
      requestAnimationFrame(tick);
    } catch (e) {
      $("#hint").textContent = (MSG[e.name] || "Câmera indisponível") + ". Ou digite o código abaixo";
      $("#retry").textContent = "Tentar de novo";
      $("#retry").hidden = false;
    }
  }

  let det = null;
  try { if ("BarcodeDetector" in window) det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { det = null; }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  let scanning = false;

  /* Região do vídeo que fica dentro da moldura (o vídeo usa object-fit: cover) */
  function areaLeitura(v) {
    const vr = v.getBoundingClientRect(), fr = $(".frame").getBoundingClientRect();
    const sc = Math.max(vr.width / v.videoWidth, vr.height / v.videoHeight);
    const ox = (vr.width - v.videoWidth * sc) / 2, oy = (vr.height - v.videoHeight * sc) / 2;
    let sx = (fr.left - vr.left - ox) / sc, sy = (fr.top - vr.top - oy) / sc;
    let sw = fr.width / sc, sh = fr.height / sc;
    sx = Math.max(0, sx); sy = Math.max(0, sy);
    sw = Math.min(sw, v.videoWidth - sx); sh = Math.min(sh, v.videoHeight - sy);
    return { sx, sy, sw, sh };
  }

  async function tick() {
    const v = $("#v");
    if (!busy && !scanning && v.readyState >= 2 && v.videoWidth) {
      scanning = true;
      try {
        const a = areaLeitura(v);
        if (a.sw > 20 && a.sh > 20) {
          const k = Math.min(1, 960 / Math.max(a.sw, a.sh));
          cv.width = Math.round(a.sw * k); cv.height = Math.round(a.sh * k);
          cx.drawImage(v, a.sx, a.sy, a.sw, a.sh, 0, 0, cv.width, cv.height);
          let data = "";
          if (det) { const r = await det.detect(cv); if (r.length) data = r[0].rawValue; }
          if (!data && window.jsQR) {
            const q = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: "dontInvert" });
            if (q && q.data) data = q.data;
          }
          if (data) check(data);
        }
      } catch (e) { }
      scanning = false;
    }
    requestAnimationFrame(tick);
  }

  /* ---- validação e resultado ---- */
  const VIEW = {
    ok: { st: "Entrada liberada", ic: "M5 12.5l4.5 4.5L19 7.5" },
    used: { st: "Ingresso já utilizado", ic: "M12 4.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15zM12 8v4.5l3 1.8" },
    invalid: { st: "Ingresso inválido", ic: "M6 6l12 12M18 6L6 18" },
    error: { st: "Não foi possível validar", ic: "M12 6v8M12 18v.01" }
  };

  const SOM = {
    ok: [[60, 60, 160], [[1175, 0, 0.12], [1568, 0.15, 0.2]]],
    used: [[160, 90, 160, 90, 160], [[330, 0, 0.2], [330, 0.28, 0.2], [262, 0.56, 0.35]]],
    invalid: [[500], [[165, 0, 0.45, "sawtooth", 0.35], [110, 0.5, 0.8, "sawtooth", 0.35]]],
    error: [[160, 90, 160], [[262, 0, 0.25], [220, 0.3, 0.4]]]
  };

  async function check(raw) {
    const code = String(raw).trim().toUpperCase();
    if (busy || (code === lastCode && Date.now() - lastAt < 4000)) return;
    busy = true; lastCode = code; lastAt = Date.now();
    $("#load").hidden = false; sinal(90, [[880, 0, 0.12]]);
    $("#hint").textContent = "Validando…";
    let d;
    try { d = await api({ code }); } catch (e) { d = { error: "Sem conexão." }; }
    show(d);
  }

  function libera() {
    lastAt = Date.now();
    $("#hint").textContent = "Aponte para o QR Code";
    $("#man").value = "";
    busy = false;
  }

  const res = $("#res");
  let timer = null, shownAt = 0;

  function fecha() {
    if (res.hidden) return;
    clearTimeout(timer);
    res.hidden = true;
    libera();
  }

  function show(d) {
    const key = d.error ? "error" : d.status in VIEW ? d.status : "error";
    const m = VIEW[key];
    $("#load").hidden = true;
    if (typeof d.total === "number") setCount(d.total); else if (key === "ok") atualizaTotal();
    sinal(SOM[key][0], SOM[key][1]);

    const ms = 3000;
    const sub = d.nome ? [d.tipo, key === "used" && d.at ? "Entrou em " + d.at : ""].filter(Boolean).join(" · ") : "";
    const msg = d.nome ? "" : (d.error || (key === "invalid" ? "Código não encontrado. Confira e tente de novo." : ""));

    res.dataset.s = key;
    $("#rs-t").textContent = m.st;
    $("#rs-ic").innerHTML = '<svg viewBox="0 0 24 24"><path d="' + m.ic + '"/></svg>';
    const nm = $("#rs-nm");
    nm.textContent = d.nome || msg;
    nm.classList.toggle("msg", !d.nome);
    nm.hidden = !nm.textContent;
    const s = $("#rs-sub"); s.textContent = sub; s.hidden = !sub;

    res.style.setProperty("--t", ms + "ms");
    shownAt = Date.now();
    res.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(fecha, ms);
  }

  res.addEventListener("click", () => { if (Date.now() - shownAt > 600) fecha(); });

  /* ---- digitação manual: o código é formatado enquanto se digita ---- */
  $("#man").addEventListener("input", e => {
    const s = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 15);
    e.target.value = [s.slice(0, 5), s.slice(5, 10), s.slice(10, 15)].filter(Boolean).join("-");
  });
  $("#manual").addEventListener("submit", e => {
    e.preventDefault();
    const c = $("#man").value.trim();
    if (c) { liberaAudio(); lastCode = ""; check(c); }
  });

  $("#retry").onclick = start;
  atualizaTotal();
  setInterval(atualizaTotal, 30000);
</script>
</body>
</html>
